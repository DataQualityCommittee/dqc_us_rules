name: Build Validation Container

on:
  workflow_dispatch:
    inputs:
      arelle_version:
        description: 'Arelle-release pip version ("latest" for the newest release or other supported version)'
        required: true
        default: '2.37.58'
        type: choice
        options:
          - latest
          - '2.37.58'
      xule_version:
        description: 'Xule plugin branch/tag (avoid "/" — it is used verbatim in the published image tag)'
        required: true
        default: '30052.1'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/validation
  XULE_REPO: xbrlus

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arelle-${{ inputs.arelle_version }}-xule-${{ inputs.xule_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            XULE_VERSION=${{ inputs.xule_version }}
            XULE_REPO=${{ env.XULE_REPO }}
            TRANSFORM_VERSION=25.1
            ARELLE_VERSION=${{ inputs.arelle_version }}
