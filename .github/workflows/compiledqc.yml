name: Compile DQC Rulesets

on:
  workflow_dispatch:
    inputs:
      taxonomy:
        description: 'Taxonomy(ies) to compile ("all" or a comma-separated list like "us,ifrs")'
        required: true
        default: 'all'
        type: string
      year:
        description: 'Year(s) to compile ("all" or a comma-separated list like "2025,2026")'
        required: true
        default: 'all'
        type: string
      arelle_version:
        description: 'Arelle-release pip version ("latest" for the newest release or other supported version)'
        required: true
        default: '2.37.58'
        type: choice
        options:
          - latest
          - '2.37.58'
      xule_version:
        description: 'Xule plugin branch/tag'
        required: true
        default: '30052.1'
        type: string
      version_suffix:
        description: 'Suffix appended to the zip filename/tag (e.g. "-test" for a test build; leave empty for a plain V30 release build)'
        required: false
        default: ''
        type: string
      ruleset_version:
        description: 'Version label for the commit message (e.g. "V30.0.1"); if empty, defaults to the branch-derived tag + suffix'
        required: false
        default: ''
        type: string
      use_prebuilt_env:
        description: 'Use the prebuilt Arelle/Xule container image from the "Build Validation Container" workflow instead of building a fresh environment (faster). Requires that workflow to have already been run with the same arelle_version/xule_version.'
        required: true
        default: true
        type: boolean

env:
  XULE_REPO: xbrlus
  VENV_PATH: ${{ github.workspace }}/../dqc-venv

jobs:
  build-env:
    name: Build Python/Arelle/Xule environment
    if: inputs.use_prebuilt_env == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gcc g++ python3-dev libxml2-dev libxslt1-dev

      - name: Create virtual environment
        run: python -m venv --copies "${{ env.VENV_PATH }}"

      - name: Add virtual environment to PATH
        run: echo "${{ env.VENV_PATH }}/bin" >> "$GITHUB_PATH"

      - name: Install Arelle and Xule plugin
        run: |
          pip install --no-cache-dir -r requirements.txt
          if [ "${{ inputs.arelle_version }}" = "latest" ]; then
            pip install --no-cache-dir --upgrade Arelle-release
          else
            pip install --no-cache-dir Arelle-release==${{ inputs.arelle_version }}
          fi
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          git clone --depth=1 --branch ${{ inputs.xule_version }} --single-branch \
            https://github.com/${{ env.XULE_REPO }}/xule.git /tmp/xule
          cp -r /tmp/xule/plugin/xule "$SITE_PACKAGES/arelle/plugin/"
          cp /tmp/xule/plugin/semanticHash.py "$SITE_PACKAGES/arelle/plugin/"
          cp /tmp/xule/plugin/validate/DQC.py "$SITE_PACKAGES/arelle/plugin/validate/"
          rm -rf /tmp/xule

      - name: Archive virtual environment
        run: tar -C "${{ env.VENV_PATH }}" -czf /tmp/dqc-venv.tar.gz .

      - name: Upload environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: dqc-venv
          path: /tmp/dqc-venv.tar.gz
          retention-days: 1

  build-matrix:
    name: Discover source directories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover compilable sources
        id: discover
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION_TAG="$(echo "$BRANCH" | sed 's/^v/V/')${{ inputs.version_suffix }}"
          TAXONOMY="${{ inputs.taxonomy }}"
          YEAR="${{ inputs.year }}"

          MATRIX=$(python3 -c "
          import json, os, sys

          source_root = 'dqc_us_rules/source'
          version_tag = '$VERSION_TAG'
          taxonomy_filters = [t.strip() for t in '$TAXONOMY'.split(',') if t.strip()]
          year_filters = [y.strip() for y in '$YEAR'.split(',') if y.strip()]
          includes = []

          for taxonomy in sorted(os.listdir(source_root)):
              tax_path = os.path.join(source_root, taxonomy)
              if not os.path.isdir(tax_path) or taxonomy == 'lib':
                  continue
              if 'all' not in taxonomy_filters and taxonomy not in taxonomy_filters:
                  continue
              for year_dir in sorted(os.listdir(tax_path)):
                  dir_path = os.path.join(tax_path, year_dir)
                  if not os.path.isdir(dir_path):
                      continue
                  if 'all' not in year_filters and not any(year_dir == yf or year_dir.endswith(yf) for yf in year_filters):
                      continue
                  # Build output zip name: dqc-{taxonomy}-{year}-{version}-ruleset.zip
                  # For esef dirs like 'esef-2020', use that directly
                  zip_name = f'dqc-{year_dir if taxonomy == \"esef\" else taxonomy + \"-\" + year_dir}-{version_tag}-ruleset.zip'
                  includes.append({
                      'taxonomy': taxonomy,
                      'year_dir': year_dir,
                      'source_path': dir_path,
                      'zip_name': zip_name,
                      'label': f'{taxonomy}/{year_dir}',
                  })

          if not includes:
              print('No matching source directories found', file=sys.stderr)
              sys.exit(1)

          print(json.dumps({'include': includes}))
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "Sources to compile:"
          echo "$MATRIX" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for item in data['include']:
              print(f\"  {item['label']} → {item['zip_name']}\")
          "

  compile-prebuilt:
    name: "${{ matrix.label }} (prebuilt env)"
    if: inputs.use_prebuilt_env
    needs: build-matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/validation:arelle-${{ inputs.arelle_version }}-xule-${{ inputs.xule_version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ruleset
        uses: ./.github/actions/compile-ruleset
        with:
          source_path: ${{ matrix.source_path }}
          zip_name: ${{ matrix.zip_name }}

  compile-fresh:
    name: "${{ matrix.label }} (fresh env)"
    if: inputs.use_prebuilt_env == false
    needs: [build-env, build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download environment artifact
        uses: actions/download-artifact@v4
        with:
          name: dqc-venv
          path: /tmp/dqc-venv

      - name: Restore virtual environment
        run: |
          mkdir -p "${{ env.VENV_PATH }}"
          tar -C "${{ env.VENV_PATH }}" -xzf /tmp/dqc-venv/dqc-venv.tar.gz

      - name: Add virtual environment to PATH
        run: echo "${{ env.VENV_PATH }}/bin" >> "$GITHUB_PATH"

      - name: Compile ruleset
        uses: ./.github/actions/compile-ruleset
        with:
          source_path: ${{ matrix.source_path }}
          zip_name: ${{ matrix.zip_name }}

  commit:
    name: Commit all rulesets
    needs: [compile-prebuilt, compile-fresh]
    if: always() && (needs.compile-prebuilt.result == 'success' || needs.compile-fresh.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all compiled rulesets
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: 'dqc-*-ruleset.zip'

      - name: Copy rulesets into repo
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -name '*.zip' -type f
          find ./artifacts -name '*.zip' -type f -exec cp {} ./dqc_us_rules/ \;
          echo ""
          echo "Rulesets in dqc_us_rules/:"
          ls -lh ./dqc_us_rules/*.zip

      - name: Commit and push
        run: |
          VERSION_TAG="$(echo '${{ github.ref_name }}' | sed 's/^v/V/')${{ inputs.version_suffix }}"
          COMMIT_VERSION="${{ inputs.ruleset_version }}"
          if [ -z "$COMMIT_VERSION" ]; then
            COMMIT_VERSION="$VERSION_TAG"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./dqc_us_rules/*.zip
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "$(cat <<EOF
          Recompile ruleset .zip files

          Python 3.13 || Arelle ${{ inputs.arelle_version }} || XULE ${{ inputs.xule_version }} for ${COMMIT_VERSION}
          EOF
          )"
          git push
