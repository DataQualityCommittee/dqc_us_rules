          fi

  # ──────────────────────────────────────────────
  #  Combine failing validation HTML reports into one artifact
  # ──────────────────────────────────────────────
  combine-html-reports:
    name: Combine discrepancy HTML reports
    needs: [validate-prebuilt, validate-fresh]
    if: always() && (needs.validate-prebuilt.result != 'skipped' || needs.validate-fresh.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      combined_artifact_url: ${{ steps.upload.outputs.artifact-url }}
      report_summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Download all discrepancy reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          path: ./discrepancies
          pattern: 'discrepancies-*'
          merge-multiple: true

      - name: Check for discrepancy reports
        id: check
        run: |
          COUNT=$(find ./discrepancies -name '*.html' -type f 2>/dev/null | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT discrepancy HTML report(s)."

      - name: Stitch discrepancy HTML reports into one file, sorted by code
        id: stitch
        if: steps.check.outputs.count != '0'
        run: |
          python3 << 'PYEOF'
          import glob
          import html
          import re

          row_re = re.compile(r'<tr>.*?</tr>', re.S)
          cell_re = re.compile(r'<t[hd][^>]*>(.*?)</t[hd]>', re.S)

          header = None
          rows = []  # (sort_key, row_html)

          for fname in sorted(glob.glob('./discrepancies/*.html')):
              label = fname.rsplit('/', 1)[-1]
              if label.endswith('.html'):
                  label = label[:-len('.html')]
              if label.startswith('discrepancies-'):
                  label = label[len('discrepancies-'):]

              with open(fname, encoding='utf-8') as f:
                  content = f.read()
              trs = row_re.findall(content)
              if not trs:
                  continue
              if header is None:
                  header = trs[0].replace('<tr>', '<tr><th>test case</th>', 1)
              for tr in trs[1:]:
                  cell_match = cell_re.search(tr)
                  code_html = cell_match.group(1) if cell_match else ''
                  code_text = re.split(r'<br\s*/?>', code_html, maxsplit=1)[0].strip()
                  tr_with_label = tr.replace('<tr>', f"<tr><td valign='top'>{html.escape(label)}</td>", 1)
                  rows.append((code_text, tr_with_label))

          rows.sort(key=lambda r: r[0])

          html_start = """<html><head><style>
          table {
              border-collapse: collapse;
          }

          table, th, td {
              border: 1px solid black;
          }
                      </style></head><body><table>"""
          html_end = '</table></body></html>'

          with open('combined-discrepancies.html', 'w', encoding='utf-8') as out:
              out.write(html_start)
              if header:
                  out.write(header)
              for _, tr in rows:
                  out.write(tr)
              out.write(html_end)

          print(f'Stitched {len(rows)} discrepancy row(s) from the downloaded reports, sorted by code.')
          PYEOF

      - name: Upload combined discrepancies artifact
        id: upload
        if: steps.check.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.run_id }}"
          path: combined-discrepancies.html
          retention-days: 30

      - name: Build combined discrepancy text summary
        id: summary
        if: steps.check.outputs.count != '0'
        run: |
          pip install --quiet tabulate
          python3 << 'PYEOF'
          import glob
          import json
          import os
          from tabulate import tabulate

          def split_string(s, size):
              def _split(s, size):
                  for pos in range(0, len(s), size):
                      yield s[pos:pos + size]
              return '\n'.join('\n'.join(_split(line, size)) for line in str(s).split('\n'))

          rows = []
          for fname in sorted(glob.glob('./discrepancies/*.json')):
              with open(fname, encoding='utf-8') as f:
                  rows.extend(json.load(f))

          rows.sort(key=lambda r: str(r.get('code', '')).split('\n', 1)[0])

          headers = ['test case', 'code', 'message', 'test count', 'expected count']
          tab_report = [
              [
                  split_string(r.get('test case', ''), 18),
                  split_string(r.get('code', ''), 18),
                  split_string(r.get('message', ''), 65),
                  split_string(r.get('test count', ''), 8),
                  split_string(r.get('expected count', ''), 8),
              ]
              for r in rows
          ]
          summary_table = tabulate(tab_report, headers=headers, tablefmt='grid') if tab_report else 'No differences.'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('summary<<GH_REPORT_SUMMARY_EOF\n')
              out.write(summary_table + '\n')
              out.write('GH_REPORT_SUMMARY_EOF\n')

          print(f'Combined {len(rows)} discrepancy row(s) from {len(glob.glob("./discrepancies/*.json"))} report(s) into a single table, sorted by code.')
          PYEOF

      - name: Delete staged per-test discrepancy artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name | startswith("discrepancies-")) | .id' | \
          while read -r artifact_id; do
            echo "Deleting staged artifact $artifact_id"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact_id" || true
          done

  # ──────────────────────────────────────────────
  #  Commit compiled rulesets
  # ──────────────────────────────────────────────
  commit:
    name: Commit all rulesets
    needs: [compile-prebuilt, compile-fresh, validate-prebuilt, validate-fresh]
    if: >-
      always()
      && inputs.skip_compilation == false
      && (needs.compile-prebuilt.result == 'success' || needs.compile-fresh.result == 'success')
      && (needs.validate-prebuilt.result == 'success' || needs.validate-prebuilt.result == 'skipped')
      && (needs.validate-fresh.result == 'success' || needs.validate-fresh.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all compiled rulesets
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          pattern: 'dqc-*-ruleset.zip'

      - name: Copy rulesets into repo
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -name '*.zip' -type f
          find ./artifacts -name '*.zip' -type f -exec cp {} ./dqc_us_rules/ \;
          echo ""
          echo "Rulesets in dqc_us_rules/:"
          ls -lh ./dqc_us_rules/*.zip

      - name: Detect Python version from Dockerfile
        id: pyver
        run: |
          PY_VERSION=$(grep -oP '(?<=FROM python:)[^\s-]+' Dockerfile)
          echo "python_version=${PY_VERSION:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Extract ruleset version from version.xule
        id: version
        run: |
          RULE_VERSION=$(grep -oP "(?<=\\\$ruleVersion = ')[^']+" dqc_us_rules/source/lib/version.xule)
          if [ -z "$RULE_VERSION" ]; then
            echo "::error::Could not extract \$ruleVersion from dqc_us_rules/source/lib/version.xule"
            exit 1
          fi
          echo "rule_version=$RULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted ruleset version: $RULE_VERSION"

      - name: Update rulesetMap.json version references
        env:
          RULE_VERSION: ${{ steps.version.outputs.rule_version }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          MAP_VERSION="v${RULE_VERSION}"
          sed -i -E "s|/dqc_us_rules/raw/[^/]+/dqc_us_rules/|/dqc_us_rules/raw/${MAP_VERSION}/dqc_us_rules/|g" rulesetMap.json
          sed -i -E "s/-v([0-9]+)-ruleset\.zip/-V\1-ruleset.zip/g" rulesetMap.json
          echo "Updated rulesetMap.json version to: ${MAP_VERSION}"
          cat rulesetMap.json

      - name: Commit and push
        env:
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
          BRANCH_NAME: ${{ github.ref_name }}
          RULE_VERSION: ${{ steps.version.outputs.rule_version }}
          PY_VERSION: ${{ steps.pyver.outputs.python_version }}
          ARELLE_VERSION: ${{ inputs.arelle_version }}
          XULE_VERSION: ${{ inputs.xule_version }}
          EDGAR_VERSION: ${{ inputs.edgar_version }}
          TEST_MODE: ${{ inputs.test_mode }}
          SKIP_COMPILATION: ${{ inputs.skip_compilation }}
        run: |
          COMMIT_VERSION="v${RULE_VERSION}"
          if [ "$SKIP_COMPILATION" = "true" ]; then
            ACTION="Test"
          elif [ "$TEST_MODE" = "none" ]; then
            ACTION="Recompile"
          else
            ACTION="Recompile and test"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./dqc_us_rules/*.zip rulesetMap.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          COMMIT_MSG="${ACTION} ruleset .zip files ${COMMIT_VERSION}"
          COMMIT_MSG="${COMMIT_MSG}"$'\n\n'"Python ${PY_VERSION} || Arelle ${ARELLE_VERSION} || XULE ${XULE_VERSION} || EDGAR ${EDGAR_VERSION}"
          COMMIT_MSG="${COMMIT_MSG}"$'\n\n'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git commit -m "${COMMIT_MSG}"
          git push

  # ──────────────────────────────────────────────
  #  Final status summary
  # ──────────────────────────────────────────────
  final-status:
    name: Final status
    needs: [compile-prebuilt, compile-fresh, validate-prebuilt, validate-fresh, commit, combine-html-reports]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print combined discrepancy report
        if: needs.combine-html-reports.outputs.report_summary != ''
        env:
          COMBINED_ARTIFACT_URL: ${{ needs.combine-html-reports.outputs.combined_artifact_url }}
          REPORT_SUMMARY: ${{ needs.combine-html-reports.outputs.report_summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Failing Validation Reports"
            echo ""
            if [ -n "$COMBINED_ARTIFACT_URL" ]; then
              echo "[Download combined HTML reports](${COMBINED_ARTIFACT_URL})"
            else
              echo "Combined HTML reports: see artifacts on the [workflow run](${RUN_URL})"
            fi
            echo ""
            echo '```'
            echo "$REPORT_SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write status badge
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$HAS_FAILURE" = "true" ]; then
            COLOR="e5534b"
            LABEL="Failed"
          else
            COLOR="57ab5a"
            LABEL="Passed"
          fi
          BADGE_SRC="https://img.shields.io/badge/workflow-${LABEL}-${COLOR}"
          BADGE_HTML="<a href=\"${RUN_URL}\"><img src=\"${BADGE_SRC}\" alt=\"Workflow ${LABEL}\" /></a>"
          BADGE_MD="[![Workflow ${LABEL}](${BADGE_SRC})](${RUN_URL})"
          {
            echo "### Status Badge HTML"
            echo ""
            echo '```html'
            echo "$BADGE_HTML"
            echo '```'
            echo ""
            echo "### Status Badge Markdown"
            echo ""
            echo '```md'
            echo "$BADGE_MD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

